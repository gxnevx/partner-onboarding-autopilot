<style>
  :root {
    --ink: #172033;
    --muted: #6f7787;
    --line: #dde1e8;
    --surface: #f5f3ee;
    --paper: #ffffff;
    --navy: #15213b;
    --green: #16835f;
    --green-soft: #e8f4ef;
    --amber: #a76513;
    --amber-soft: #fff2dc;
    --red: #b43b42;
    --red-soft: #fbeaec;
    --shadow: 0 20px 60px rgba(21, 33, 59, 0.10);
    --radius: 14px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--surface);
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body { background: var(--surface); }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }

  .boot {
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 14px;
    text-align: center;
    color: var(--muted);
  }
  .boot-mark, .brand-mark {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: var(--navy);
    color: white;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 224px minmax(0, 1fr);
  }
  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 24px 16px;
    color: #dfe5ef;
    background: var(--navy);
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 8px;
  }
  .brand-mark { background: #ffffff; color: var(--navy); }
  .brand strong { display: block; color: white; font-size: 14px; }
  .brand span { font-size: 11px; color: #9da9bd; }
  .nav { display: grid; gap: 6px; }
  .nav button {
    width: 100%;
    border: 0;
    border-radius: 9px;
    padding: 11px 12px;
    text-align: left;
    color: #aeb8ca;
    background: transparent;
    transition: 160ms ease;
  }
  .nav button:hover { color: white; background: rgba(255,255,255,.06); }
  .nav button.active { color: white; background: rgba(255,255,255,.11); }
  .sidebar-foot {
    margin-top: auto;
    padding: 14px 10px 0;
    border-top: 1px solid rgba(255,255,255,.1);
    font-size: 11px;
    color: #91a0b7;
    line-height: 1.5;
  }

  .main { min-width: 0; }
  .topbar {
    height: 76px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    background: rgba(245,243,238,.92);
    backdrop-filter: blur(14px);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .eyebrow {
    margin: 0 0 5px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .topbar h1 { margin: 0; font-size: 21px; letter-spacing: -.03em; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .content { padding: 24px 30px 40px; }

  .button {
    min-height: 38px;
    border: 1px solid transparent;
    border-radius: 9px;
    padding: 8px 13px;
    color: white;
    background: var(--navy);
    font-weight: 700;
    font-size: 13px;
    transition: 150ms ease;
  }
  .button:hover { transform: translateY(-1px); }
  .button.secondary {
    color: var(--ink);
    border-color: var(--line);
    background: white;
  }
  .button.ghost { color: var(--muted); background: transparent; }
  .button.success { background: var(--green); }
  .button.danger { color: var(--red); border-color: #efc7ca; background: white; }
  .button:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .page-grid {
    display: grid;
    grid-template-columns: minmax(260px, .72fr) minmax(500px, 1.5fr);
    min-height: calc(100vh - 126px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: white;
  }
  .page-grid.three {
    grid-template-columns: 280px minmax(460px, 1fr) 300px;
  }
  .rail {
    min-width: 0;
    border-right: 1px solid var(--line);
    background: #fbfaf7;
  }
  .inspector {
    min-width: 0;
    border-left: 1px solid var(--line);
    background: #fbfaf7;
  }
  .section-head {
    padding: 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .section-head h2 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
  .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .list { display: grid; }
  .list-item {
    width: 100%;
    padding: 15px 20px;
    border: 0;
    border-bottom: 1px solid var(--line);
    text-align: left;
    background: transparent;
    transition: 150ms ease;
  }
  .list-item:hover, .list-item.active { background: white; }
  .list-item.active { box-shadow: inset 3px 0 var(--green); }
  .list-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 13px;
    font-weight: 750;
  }
  .list-meta { margin-top: 5px; color: var(--muted); font-size: 11px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .badge.green { color: var(--green); background: var(--green-soft); }
  .badge.amber { color: var(--amber); background: var(--amber-soft); }
  .badge.red { color: var(--red); background: var(--red-soft); }
  .badge.gray { color: #687185; background: #edf0f4; }

  .workspace { min-width: 0; padding: 24px; background: var(--paper); }
  .workspace.nopad { padding: 0; }
  .workspace-title {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 22px;
  }
  .workspace-title h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.04em; }
  .workspace-title p { margin: 0; color: var(--muted); font-size: 13px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }

  .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .field-grid .full { grid-column: 1 / -1; }
  label.field { display: grid; gap: 7px; color: #51596a; font-size: 11px; font-weight: 750; }
  input, textarea, select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px 11px;
    color: var(--ink);
    background: white;
    outline: none;
  }
  input:focus, textarea:focus, select:focus {
    border-color: #8fbbaa;
    box-shadow: 0 0 0 3px rgba(22,131,95,.09);
  }
  textarea { min-height: 92px; resize: vertical; line-height: 1.45; }
  .subsection { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); }
  .subsection h3 { margin: 0 0 13px; font-size: 13px; }
  .repeat-row {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1.4fr auto;
    gap: 8px;
    margin-bottom: 8px;
  }
  .repeat-row.resource { grid-template-columns: .8fr 1.2fr 1.4fr auto; }
  .repeat-row.sequence { grid-template-columns: 55px 1.1fr 1.1fr 1.1fr; }

  .status-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 18px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: white;
  }
  .status-strip strong { font-size: 13px; }
  .status-strip span { color: var(--muted); font-size: 12px; }
  .toggle {
    display: inline-flex;
    padding: 3px;
    border-radius: 10px;
    background: #e9ecf1;
  }
  .toggle button {
    border: 0;
    border-radius: 8px;
    padding: 7px 11px;
    color: var(--muted);
    background: transparent;
    font-size: 11px;
    font-weight: 800;
  }
  .toggle button.active { color: white; background: var(--navy); }

  .queue-row {
    display: grid;
    grid-template-columns: 1.35fr 1fr .75fr auto;
    gap: 14px;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .queue-row strong { display: block; font-size: 13px; }
  .queue-row small { color: var(--muted); }
  .empty {
    min-height: 300px;
    display: grid;
    place-content: center;
    text-align: center;
    color: var(--muted);
  }
  .empty strong { display: block; margin-bottom: 6px; color: var(--ink); }

  .email-stage { background: #eef0f3; min-height: 100%; padding: 24px; }
  .day-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 15px;
    padding: 4px;
    border-radius: 10px;
    background: rgba(255,255,255,.72);
    width: fit-content;
  }
  .day-tabs button {
    border: 0;
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--muted);
    background: transparent;
    font-size: 12px;
    font-weight: 800;
  }
  .day-tabs button.active { color: white; background: var(--navy); }
  .email-paper {
    max-width: 720px;
    margin: 0 auto;
    border-radius: 12px;
    overflow: hidden;
    background: white;
    box-shadow: var(--shadow);
  }
  .email-chrome {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
  }
  .email-subject { margin: 0 0 15px; font-size: 20px; letter-spacing: -.025em; }
  .email-sender { display: flex; align-items: center; gap: 11px; }
  .avatar {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: white;
    background: var(--green);
    font-size: 12px;
    font-weight: 850;
  }
  .email-sender strong { display: block; font-size: 12px; }
  .email-sender span { color: var(--muted); font-size: 11px; }
  .email-body {
    padding: 28px 34px 40px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
  }
  .review-actions {
    max-width: 720px;
    margin: 14px auto 0;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .inspector-body { padding: 20px; }
  .inspector-block { padding: 0 0 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .inspector-block:last-child { border-bottom: 0; }
  .inspector-block h3 {
    margin: 0 0 7px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .inspector-block p { margin: 0; font-size: 12px; line-height: 1.5; }
  .checklist { display: grid; gap: 8px; }
  .check { color: var(--green); font-size: 12px; }
  .check.fail { color: var(--red); }

  .toast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 20;
    max-width: 360px;
    padding: 12px 15px;
    border-radius: 10px;
    color: white;
    background: var(--navy);
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: 180ms ease;
    font-size: 12px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--red); }
  .loading::after {
    content: "";
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-left: 8px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 980px) {
    .shell { grid-template-columns: 74px minmax(0, 1fr); }
    .brand-copy, .nav-label, .sidebar-foot { display: none; }
    .brand { justify-content: center; }
    .nav button { text-align: center; padding: 12px 4px; }
    .page-grid, .page-grid.three { grid-template-columns: 230px minmax(0, 1fr); }
    .inspector { display: none; }
  }
</style>
