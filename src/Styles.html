<style>
  :root {
    --ink: #242424;
    --muted: #6f716b;
    --line: #e2e5de;
    --surface: #f4f6f1;
    --paper: #ffffff;
    --navy: #242424;
    --green: #68b94f;
    --green-dark: #397b31;
    --green-soft: #edf7e9;
    --amber: #a76513;
    --amber-soft: #fff2dc;
    --red: #b43b42;
    --red-soft: #fbeaec;
    --shadow: 0 18px 55px rgba(36, 36, 36, 0.09);
    --radius: 8px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--surface);
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body { background: var(--surface); }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }

  .boot {
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 14px;
    text-align: center;
    color: var(--muted);
  }
  .boot-logo { width: 190px; height: auto; margin: 0 auto; }

  .shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 238px minmax(0, 1fr);
  }
  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 28px 18px 22px;
    color: var(--ink);
    background: #ffffff;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .brand {
    padding: 0 10px 8px;
  }
  .brand-logo { display: block; width: 164px; height: auto; }
  .nav { display: grid; gap: 2px; }
  .nav button {
    width: 100%;
    border: 0;
    border-radius: 6px;
    padding: 11px 12px;
    text-align: left;
    color: #73756f;
    background: transparent;
    transition: 160ms ease;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 650;
  }
  .nav button:hover { color: var(--ink); background: #f4f6f1; }
  .nav button.active { color: var(--ink); background: var(--green-soft); }
  .nav-marker {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c6cac1;
  }
  .nav button.active .nav-marker { background: var(--green); }
  .sidebar-foot {
    margin-top: auto;
    padding: 14px 10px 0;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: #8b8d86;
    line-height: 1.5;
  }
  .sidebar-foot strong { color: var(--ink); }

  .main { min-width: 0; }
  .topbar {
    height: 76px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    background: rgba(244,246,241,.92);
    backdrop-filter: blur(14px);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .eyebrow {
    margin: 0 0 5px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .topbar h1 { margin: 0; font-size: 21px; letter-spacing: -.03em; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .content { padding: 24px 30px 40px; }

  .button {
    min-height: 38px;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 8px 13px;
    color: white;
    background: var(--ink);
    font-weight: 700;
    font-size: 13px;
    transition: 150ms ease;
  }
  .button:hover { transform: translateY(-1px); }
  .button.secondary {
    color: var(--ink);
    border-color: var(--line);
    background: white;
  }
  .button.ghost { color: var(--muted); background: transparent; }
  .button.success { color: #173312; background: #89d36f; }
  .button.danger { color: var(--red); border-color: #efc7ca; background: white; }
  .button:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .page-grid {
    display: grid;
    grid-template-columns: minmax(260px, .72fr) minmax(500px, 1.5fr);
    min-height: calc(100vh - 126px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: white;
  }
  .page-grid.three {
    grid-template-columns: 280px minmax(460px, 1fr) 300px;
  }
  .rail {
    min-width: 0;
    border-right: 1px solid var(--line);
    background: #fbfaf7;
  }
  .inspector {
    min-width: 0;
    border-left: 1px solid var(--line);
    background: #fbfaf7;
  }
  .section-head {
    padding: 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .section-head h2 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
  .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .list { display: grid; }
  .list-item {
    width: 100%;
    padding: 15px 20px;
    border: 0;
    border-bottom: 1px solid var(--line);
    text-align: left;
    background: transparent;
    transition: 150ms ease;
  }
  .list-item:hover, .list-item.active { background: white; }
  .list-item.active { box-shadow: inset 3px 0 var(--green); }
  .list-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 13px;
    font-weight: 750;
  }
  .list-meta { margin-top: 5px; color: var(--muted); font-size: 11px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .badge.green { color: var(--green); background: var(--green-soft); }
  .badge.amber { color: var(--amber); background: var(--amber-soft); }
  .badge.red { color: var(--red); background: var(--red-soft); }
  .badge.gray { color: #687185; background: #edf0f4; }

  .workspace { min-width: 0; padding: 24px; background: var(--paper); }
  .workspace.nopad { padding: 0; }
  .workspace-title {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 22px;
  }
  .workspace-title h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.04em; }
  .workspace-title p { margin: 0; color: var(--muted); font-size: 13px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }

  .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .field-grid .full { grid-column: 1 / -1; }
  label.field { display: grid; gap: 7px; color: #51596a; font-size: 11px; font-weight: 750; }
  input, textarea, select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 11px;
    color: var(--ink);
    background: white;
    outline: none;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(104,185,79,.12);
  }
  textarea { min-height: 92px; resize: vertical; line-height: 1.45; }
  .subsection { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); }
  .subsection h3 { margin: 0 0 13px; font-size: 13px; }
  .repeat-row {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1.4fr auto;
    gap: 8px;
    margin-bottom: 8px;
  }
  .repeat-row.resource { grid-template-columns: .8fr 1.2fr 1.4fr auto; }
  .repeat-row.sequence { grid-template-columns: 55px 1.1fr 1.1fr 1.1fr; }

  .status-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 18px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: white;
  }
  .status-strip > div:first-child {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .status-strip strong { font-size: 13px; }
  .status-strip span { color: var(--muted); font-size: 12px; }
  .status-dot {
    display: inline-block;
    flex: 0 0 auto;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #b9bdb5;
    box-shadow: 0 0 0 4px #eceee9;
  }
  .status-dot.on {
    background: var(--green);
    box-shadow: 0 0 0 4px var(--green-soft);
  }
  .toggle {
    display: inline-flex;
    padding: 3px;
    border-radius: 10px;
    background: #e9ecf1;
  }
  .toggle button {
    border: 0;
    border-radius: 8px;
    padding: 7px 11px;
    color: var(--muted);
    background: transparent;
    font-size: 11px;
    font-weight: 800;
  }
  .toggle button.active { color: #173312; background: #89d36f; }

  .flow-explainer {
    display: grid;
    grid-template-columns: minmax(220px, .95fr) minmax(460px, 1.8fr) 120px;
    gap: 28px;
    align-items: center;
    margin-bottom: 18px;
    padding: 24px 26px;
    color: #f8faf6;
    background: #242424;
    border-radius: var(--radius);
  }
  .kicker {
    display: block;
    margin-bottom: 8px;
    color: var(--green-dark);
    font-size: 10px;
    font-weight: 850;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .flow-intro .kicker { color: #91d879; }
  .flow-intro h2 { margin: 0 0 7px; font-size: 21px; letter-spacing: -.035em; }
  .flow-intro p, .flow-step p { margin: 0; color: #b9bdb7; font-size: 12px; line-height: 1.5; }
  .flow-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .flow-step { display: flex; gap: 10px; }
  .flow-step > span {
    flex: 0 0 auto;
    width: 23px;
    height: 23px;
    display: grid;
    place-items: center;
    border: 1px solid #667060;
    border-radius: 50%;
    color: #91d879;
    font-size: 10px;
    font-weight: 850;
  }
  .flow-step strong { display: block; margin: 2px 0 4px; font-size: 12px; }
  .flow-output { padding-left: 22px; border-left: 1px solid #454a43; }
  .flow-output strong { display: block; color: #91d879; font-size: 34px; letter-spacing: -.05em; }
  .flow-output span { display: block; color: #b9bdb7; font-size: 11px; line-height: 1.3; }

  .queue-row {
    display: grid;
    grid-template-columns: 1.35fr 1fr .75fr auto;
    gap: 14px;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .queue-row strong { display: block; font-size: 13px; }
  .queue-row small { color: var(--muted); }
  .empty {
    min-height: 300px;
    display: grid;
    place-content: center;
    text-align: center;
    color: var(--muted);
  }
  .empty strong { display: block; margin-bottom: 6px; color: var(--ink); }

  .demo-heading { margin-bottom: 18px; }
  .demo-heading h2 { margin-bottom: 6px; font-size: 19px; }
  .simulation-panel {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(220px, .65fr);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .simulation-form { padding: 22px; }
  .numbered-field {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    gap: 12px;
    align-items: start;
    margin-bottom: 18px;
  }
  .numbered-field > span, .step-number {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: #173312;
    background: #a2df8d;
    font-size: 11px;
    font-weight: 850;
  }
  .simulation-action {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    gap: 12px;
    align-items: start;
    padding-top: 2px;
  }
  .simulation-action p {
    max-width: 440px;
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.45;
  }
  .simulation-note {
    padding: 24px;
    background: #f1f4ed;
    border-left: 1px solid var(--line);
  }
  .simulation-note strong { display: block; margin-bottom: 8px; font-size: 14px; }
  .simulation-note p { margin: 0 0 16px; color: var(--muted); font-size: 12px; line-height: 1.55; }
  .simulation-note select {
    margin-bottom: 14px;
    padding: 8px 9px;
    font-size: 11px;
  }
  .text-button {
    padding: 0 0 3px;
    border: 0;
    border-bottom: 1px solid var(--ink);
    color: var(--ink);
    background: transparent;
    font-size: 11px;
    font-weight: 750;
  }

  .email-stage { background: #eef1eb; min-height: 100%; padding: 24px; }
  .day-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 15px;
    padding: 4px;
    border-radius: 10px;
    background: rgba(255,255,255,.72);
    width: fit-content;
  }
  .day-tabs button {
    border: 0;
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--muted);
    background: transparent;
    font-size: 12px;
    font-weight: 800;
  }
  .day-tabs button.active { color: #173312; background: #89d36f; }
  .email-paper {
    max-width: 720px;
    margin: 0 auto;
    border-radius: 12px;
    overflow: hidden;
    background: white;
    box-shadow: var(--shadow);
  }
  .email-chrome {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
  }
  .email-subject { margin: 0 0 15px; font-size: 20px; letter-spacing: -.025em; }
  .email-sender { display: flex; align-items: center; gap: 11px; }
  .avatar {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: white;
    background: var(--green);
    font-size: 12px;
    font-weight: 850;
  }
  .email-sender strong { display: block; font-size: 12px; }
  .email-sender span { color: var(--muted); font-size: 11px; }
  .email-body {
    padding: 28px 34px 40px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
  }
  .review-actions {
    max-width: 720px;
    margin: 14px auto 0;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .inspector-body { padding: 20px; }
  .inspector-block { padding: 0 0 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .inspector-block:last-child { border-bottom: 0; }
  .inspector-block h3 {
    margin: 0 0 7px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .inspector-block p { margin: 0; font-size: 12px; line-height: 1.5; }
  .checklist { display: grid; gap: 8px; }
  .check { color: var(--green); font-size: 12px; }
  .check.fail { color: var(--red); }

  .toast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 20;
    max-width: 360px;
    padding: 12px 15px;
    border-radius: 10px;
    color: white;
    background: var(--ink);
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: 180ms ease;
    font-size: 12px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--red); }
  .loading::after {
    content: "";
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-left: 8px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 980px) {
    .shell { grid-template-columns: 74px minmax(0, 1fr); }
    .nav-label, .sidebar-foot { display: none; }
    .brand { justify-content: center; }
    .brand-logo { width: 42px; }
    .nav button { justify-content: center; padding: 12px 4px; }
    .page-grid, .page-grid.three { grid-template-columns: 230px minmax(0, 1fr); }
    .inspector { display: none; }
    .flow-explainer { grid-template-columns: 1fr; }
    .flow-output { padding: 0; border: 0; }
    .simulation-panel { grid-template-columns: 1fr; }
    .simulation-note { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
